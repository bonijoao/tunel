name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest
      - if: runner.os == 'Windows'
        run: pyinstaller --onefile --windowed --name tunel --hidden-import keyring.backends.Windows run.py
      - if: runner.os == 'Linux'
        run: pyinstaller --onefile --windowed --name tunel --hidden-import keyring.backends.SecretService --hidden-import keyring.backends.fail run.py
      - uses: actions/upload-artifact@v4
        with:
          name: tunel-${{ runner.os }}
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefatos
      - uses: softprops/action-gh-release@v2
        with:
          files: artefatos/**/*
